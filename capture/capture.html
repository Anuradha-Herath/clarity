<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity — Quick Capture</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <link rel="stylesheet" href="capture.css" />
</head>
<body>
  <div class="capture-shell">

    <!-- Header -->
    <div class="capture-header">
      <div class="capture-brand">
        <div class="brand-dot"></div>
        <span>Quick Capture</span>
      </div>
      <button class="btn btn-ghost btn-icon" id="btn-close" data-tooltip="Close">
        <!-- X icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Input -->
    <div class="capture-input-wrap">
      <input
        id="capture-input"
        class="capture-input"
        type="text"
        placeholder="Capture a thought…"
        autocomplete="off"
        spellcheck="true"
        maxlength="500"
      />
    </div>

    <!-- Route buttons -->
    <div class="capture-routes">
      <button class="route-btn" id="route-today" data-route="today">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Today
        <span class="route-hint">↵</span>
      </button>

      <button class="route-btn" id="route-someday" data-route="someday">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Someday
      </button>

      <button class="route-btn" id="route-goal" data-route="goal">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="2"/>
        </svg>
        Goal idea
      </button>

      <button class="route-btn" id="route-vision" data-route="vision">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Vision note
      </button>
    </div>

    <!-- Status message (briefly shown on save) -->
    <div id="capture-status" class="capture-status hidden"></div>

  </div>

  <script type="module" src="capture.js"></script>
</body>
</html>
