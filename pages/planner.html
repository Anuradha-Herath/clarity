<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planner — Clarity</title>
  <meta name="description" content="Plan your day, week, month, and year with Clarity." />
  <link rel="stylesheet" href="../shared/style.css" />
  <link rel="stylesheet" href="planner.css" />
</head>
<body>
  <div class="page-wrapper">

    <!-- ── Header ─────────────────────────────────────────── -->
    <header class="page-header">
      <div class="header-brand">
        <div class="brand-dot"></div>
        Clarity
      </div>
      <nav class="header-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="planner.html"   class="nav-link active">Planner</a>
        <a href="vision.html"    class="nav-link">Vision</a>
        <a href="tracker.html"   class="nav-link">Tracker</a>
      </nav>
    </header>

    <!-- ── Tab bar ────────────────────────────────────────── -->
    <div class="tab-bar" id="planner-tab-bar">
      <button class="tab-btn active" data-tab="day">Day</button>
      <button class="tab-btn" data-tab="week">Week</button>
      <button class="tab-btn" data-tab="month">Month</button>
      <button class="tab-btn" data-tab="year">Year</button>
    </div>

    <!-- ════════════════════════════════════════════════════
         DAY TAB
    ════════════════════════════════════════════════════ -->
    <div class="tab-panel active" id="tab-day">

      <!-- Date navigation -->
      <div class="planner-day-nav">
        <button class="btn btn-ghost btn-sm" id="btn-prev-day">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Prev
        </button>
        <div class="day-nav-center">
          <div class="day-nav-date" id="day-nav-date">Monday, June 9</div>
          <button class="btn btn-accent-soft btn-sm hidden" id="btn-go-today">Today</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="btn-next-day">
          Next
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

      <!-- Category pills -->
      <div class="cat-pills-bar" id="cat-pills-bar">
        <span class="cat-bar-label">Category:</span>
        <div class="cat-pill selected" data-cat="Deep Work">Deep Work</div>
        <div class="cat-pill" data-cat="Meetings">Meetings</div>
        <div class="cat-pill" data-cat="Health">Health</div>
        <div class="cat-pill" data-cat="Learning">Learning</div>
        <div class="cat-pill" data-cat="Personal">Personal</div>
        <div class="cat-pill" data-cat="Break">Break</div>
      </div>

      <!-- Day main: board + side panel -->
      <div class="day-main">

        <!-- Time board -->
        <div class="day-board-col">
          <div class="day-board-wrapper" id="day-board-wrapper">
            <!-- mountTimeboard() injects here -->
          </div>
        </div>

        <!-- Side panel -->
        <div class="day-side-col">

          <!-- Top 3 Priorities -->
          <div class="card mb-4">
            <div class="card-header" style="flex-wrap: wrap; gap: 8px;">
              <div class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-accent)">
                  <polyline points="9 11 12 14 22 4"/>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
                Tasks
              </div>
              <div class="flex items-center gap-2">
                <button class="btn btn-ghost btn-xs" id="btn-manage-categories" style="font-size: 11px; padding: 2px 6px;">Manage Cats</button>
                <span class="text-xs text-muted" id="priority-task-count"></span>
              </div>
            </div>

            <!-- Category Filter Row -->
            <div class="priority-filter-row" style="padding: 8px 12px; border-bottom: 1px solid var(--color-border); display: flex; gap: 8px; align-items: center; background: var(--color-bg);">
              <span class="text-xs text-muted font-semibold" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;">Filter:</span>
              <select id="priority-category-filter" class="select select-sm flex-1" style="height: 28px; font-size: 12px; padding: 2px 8px;">
                <option value="all">All Categories</option>
              </select>
            </div>

            <div id="priority-list" class="priority-list">
              <!-- Rendered by JS -->
            </div>

            <!-- Quick-add row -->
            <div class="priority-add-row" style="flex-direction: column; align-items: stretch; gap: 6px; padding: 12px; border-top: 1px solid var(--color-border);">
              <div class="flex items-center justify-between gap-2">
                <div class="priority-p-select">
                  <div class="priority-dot-btn active" data-p="1" title="High priority"></div>
                  <div class="priority-dot-btn" data-p="2" title="Medium priority"></div>
                  <div class="priority-dot-btn" data-p="3" title="Low priority"></div>
                </div>
                <select id="quick-add-category-input" class="select select-sm" style="width: 140px; height: 24px; font-size: 11px; padding: 0 4px;">
                  <!-- Dynamically populated -->
                </select>
              </div>
              <div class="flex gap-2">
                <input type="text" id="priority-input" class="input input-sm flex-1"
                       placeholder="Add a task…" maxlength="200" />
                <button class="btn btn-primary btn-sm" id="btn-add-priority">Add</button>
              </div>
            </div>
          </div>

          <!-- Day Notes -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-text-muted)">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Day Notes
              </div>
              <span class="text-xs text-muted" id="notes-hint"></span>
            </div>
            <textarea id="day-notes" class="textarea"
                      placeholder="Reflections, reminders, or ideas for today…"
                      rows="7"></textarea>
          </div>

        </div>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════
         WEEK TAB
    ════════════════════════════════════════════════════ -->
    <div class="tab-panel hidden" id="tab-week">
      <div class="planner-week-nav">
        <button class="btn btn-ghost btn-sm" id="btn-prev-week">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Prev week
        </button>
        <div class="week-nav-title" id="week-nav-title">Jun 9 – Jun 15, 2026</div>
        <button class="btn btn-ghost btn-sm" id="btn-next-week">
          Next week
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
      <div class="week-grid" id="week-grid">
        <!-- 7 columns rendered by JS -->
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════
         MONTH TAB
    ════════════════════════════════════════════════════ -->
    <div class="tab-panel hidden" id="tab-month">
      <div class="planner-month-nav">
        <button class="btn btn-ghost btn-sm" id="btn-prev-month">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Prev
        </button>
        <div class="month-nav-title" id="month-nav-title">June 2026</div>
        <button class="btn btn-ghost btn-sm" id="btn-next-month">
          Next
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
      <div class="month-dow-headers">
        <div>Mon</div><div>Tue</div><div>Wed</div>
        <div>Thu</div><div>Fri</div>
        <div class="month-weekend">Sat</div>
        <div class="month-weekend">Sun</div>
      </div>
      <div class="month-grid" id="month-grid">
        <!-- Calendar rendered by JS -->
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════
         YEAR TAB
    ════════════════════════════════════════════════════ -->
    <div class="tab-panel hidden" id="tab-year">
      <div class="planner-year-nav">
        <button class="btn btn-ghost btn-sm" id="btn-prev-year">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Prev year
        </button>
        <div class="year-nav-title" id="year-nav-title">2026</div>
        <button class="btn btn-ghost btn-sm" id="btn-next-year">
          Next year
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
      <div class="year-content" id="year-content">
        <!-- Quarter sections rendered by JS -->
      </div>
    </div>

  </div><!-- end page-wrapper -->

  <!-- Task quick-edit modal -->
  <div class="modal-overlay hidden" id="task-modal-overlay">
    <div class="modal" style="max-width:380px">
      <div class="modal-header">
        <div class="modal-title" id="task-modal-title">Edit Task</div>
        <button class="btn btn-ghost btn-icon" id="task-modal-close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="label" for="task-title-input">Title</label>
          <input type="text" id="task-title-input" class="input" placeholder="Task title" maxlength="200" />
        </div>
        <div class="form-group">
          <label class="label" for="task-category-input">Category</label>
          <select id="task-category-input" class="select">
            <!-- Dynamically populated -->
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="label" for="task-priority-input">Priority</label>
            <select id="task-priority-input" class="select">
              <option value="1">🔴 High</option>
              <option value="2">🟡 Medium</option>
              <option value="3">🟢 Low</option>
            </select>
          </div>
          <div class="form-group">
            <label class="label" for="task-estimate-input">Est. (minutes)</label>
            <input type="number" id="task-estimate-input" class="input" min="5" max="480" step="5" placeholder="30" />
          </div>
        </div>
      </div>
      <div class="modal-footer modal-footer-split">
        <button class="btn btn-danger hidden" id="btn-task-delete">Delete</button>
        <div class="flex gap-2">
          <button class="btn btn-secondary" id="btn-task-cancel">Cancel</button>
          <button class="btn btn-primary" id="btn-task-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom Categories management modal -->
  <div class="modal-overlay hidden" id="categories-modal-overlay">
    <div class="modal" style="max-width:340px">
      <div class="modal-header">
        <div class="modal-title">Manage Categories</div>
        <button class="btn btn-ghost btn-icon" id="categories-modal-close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="label" for="new-category-input">New Category</label>
          <div class="flex gap-2">
            <input type="text" id="new-category-input" class="input flex-1" placeholder="Category name (e.g. Reading)" maxlength="30" />
            <button class="btn btn-primary btn-sm" id="btn-add-custom-category">Add</button>
          </div>
        </div>
        <label class="label">Categories List</label>
        <div class="categories-list" id="manage-categories-list" style="max-height: 200px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--border-radius); background: var(--color-bg); padding: 4px;">
          <!-- Populate with existing categories and delete options -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="planner.js"></script>
</body>
</html>
